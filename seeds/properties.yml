version: 2

seeds:
  - name: raw_customers
    description: Synthetic customer extract from the operational commerce system.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
  - name: raw_orders
    description: Synthetic order header extract; one row per order.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('raw_customers')
                field: customer_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['completed', 'pending', 'returned']
  - name: raw_payments
    description: Synthetic payment events; an order may have multiple tenders.
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('raw_orders')
                field: order_id

